[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "0.1.0"
description = "A read-only GitHub MCP server (stdio transport) for LLM clients such as Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jeswin Mathew" }]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "github", "claude"]
dependencies = [
    "mcp>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Jeswinmathew12/Github-MCP"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["test_server.py"]
addopts = "-q"
